<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天水圍快行 - 交通與天氣實時屏</title>
    <style>
        :root {
            --mtr-orange: #ff9900;
            --lrt-bg: #e6f7f7;
            --lrt-text: #00a0a0;
            --text-dark: #333;
            --text-gray: #666;
            --kmb-red: #b71c1c;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f1f3f5;
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .phone-container {
            width: 100%;
            max-width: 450px;
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            background: #fff;
            position: relative;
        }

        /* 🌦️ 實時天氣資訊列 */
        .weather-bar {
            background-color: #f1f3f5;
            padding: 10px 16px;
            font-size: 0.9rem;
            color: #495057;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e9ecef;
        }
        .weather-info span {
            margin-right: 8px;
            font-weight: bold;
        }
        .warning-badge {
            background-color: #ff9900;
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
        }

        /* 標題欄 */
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 50px;
            border-bottom: 1px solid #eee;
            position: relative;
        }
        .back-btn {
            position: absolute;
            left: 15px;
            font-size: 1.5rem;
            color: var(--text-gray);
        }
        .header-title {
            font-size: 1.1rem;
            font-weight: 500;
        }

        /* 導航標籤 */
        .nav-tabs {
            display: flex;
            border-bottom: 1px solid #eee;
        }
        .tab-btn {
            flex: 1;
            text-align: center;
            padding: 14px 0;
            font-size: 1rem;
            color: var(--text-gray);
            cursor: pointer;
            border: none;
            background: none;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            outline: none;
        }
        .tab-btn.active {
            color: var(--text-dark);
            font-weight: bold;
            border-bottom: 3px solid var(--lrt-text);
        }

        /* 橘黃色方向提示框 */
        .info-banner {
            background-color: #ffcc66;
            padding: 12px 16px;
            font-size: 0.95rem;
            color: #5d4037;
            line-height: 1.5;
        }

        /* 表頭 */
        .table-subheader {
            display: flex;
            justify-content: space-between;
            padding: 10px 16px;
            font-size: 0.9rem;
            color: var(--lrt-text);
            border-bottom: 1px solid #f0f0f0;
        }

        /* 分組標題 */
        .platform-header {
            background-color: var(--lrt-bg);
            color: var(--lrt-text);
            padding: 10px 16px;
            font-weight: bold;
            font-size: 1.05rem;
        }

        /* 列表樣式 */
        .list-container {
            flex: 1;
        }
        .list-item {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            border-bottom: 1px solid #f5f5f5;
        }
        .route-no {
            font-size: 1.2rem;
            font-weight: bold;
            width: 65px;
        }
        .dest-name {
            font-size: 1.1rem;
            flex: 1;
            color: #222;
        }
        
        .train-visual {
            display: flex;
            align-items: center;
            margin-right: 15px;
        }
        .car { font-size: 1.3rem; line-height: 1; }
        .car.double { margin-left: -6px; }

        .eta-status {
            font-size: 1.05rem;
            font-weight: bold;
            text-align: right;
            width: 90px;
            color: #00bfa5;
        }
        .eta-status span { font-size: 1.3rem; margin-right: 2px; }

        .footer-note {
            padding: 20px 16px;
            font-size: 0.8rem;
            color: #999;
            line-height: 1.4;
            background-color: #fafafa;
            border-top: 1px solid #f0f0f0;
        }

        .tab-panel { display: none; }
        .tab-panel.active { display: block; }
        .loading-text { padding: 30px; text-align: center; color: #888; font-size: 0.95rem; }
    </style>
</head>
<body>

    <div class="phone-container">
        
        <!-- 🌦️ 天文台即時氣溫工具列 -->
        <div class="weather-bar">
            <div class="weather-info">
                <span id="wx-location">天水圍</span>
                <span id="wx-temp">24°C</span>
                <span id="wx-desc">部分時間有陽光</span>
                <span id="wx-warning" class="warning-badge" style="display:none;">有警告</span>
            </div>
            <div id="wx-time" style="font-size: 0.8rem; color:#888;">--:--</div>
        </div>

        <div class="header">
            <div class="back-btn">←</div>
            <div class="header-title">天水圍快行 🚃</div>
        </div>

        <div class="nav-tabs">
            <button id="btn-bus" class="tab-btn" onclick="switchTab('bus')">🚌 公共巴士</button>
            <button id="btn-lrt" class="tab-btn active" onclick="switchTab('lrt')">🚇 輕鐵</button>
        </div>

        <!-- ================= 🚇 輕鐵實時面板 ================= -->
        <div id="panel-lrt" class="tab-panel active">
            <div class="info-banner">
                當前觀測站點：天水圍站 (750) <br>
                5號月台 · 往 705 循環綫 | 6號月台 · 往 706 循環綫/751友愛
            </div>

            <div class="table-subheader">
                <div>路線 &nbsp;&nbsp;&nbsp;&nbsp; 目的地</div>
                <div class="right-sort">等候時間</div>
            </div>

            <div id="lrt-list" class="list-container">
                <!-- 預先渲染載入中文本，防卡死 -->
                <div class="loading-text">正在初始化輕鐵模組...</div>
            </div>
        </div>

        <!-- ================= 🚌 公共巴士實時面板 ================= -->
        <div id="panel-bus" class="tab-panel">
            <div class="info-banner" style="background-color: #e3f2fd; color: #0d47a1;">
                當前選定：天水圍站轉車站 (天耀路/西鐵站旁)
            </div>
            <div class="table-subheader" style="color: #0d47a1;">
                <div>路線 &nbsp;&nbsp;&nbsp;&nbsp; 目的地</div>
                <div class="right-sort">等候時間</div>
            </div>
            <div id="bus-list" class="list-container">
                <div class="loading-text">正在初始化巴士模組...</div>
            </div>
        </div>

        <div class="footer-note">
            <div id="update-timer" style="margin-bottom: 5px; color: #666; font-weight: bold;">數據同步中...</div>
            <span id="env-mode" style="color:#2b8a3e; font-size:0.75rem; font-weight:bold;">模式：偵測中</span><br>
            *備註：網頁每 12 秒全自動倒數刷新。如身處本地測試環境將顯示模擬動態。
        </div>
    </div>

    <script>
        // 精準偵測當前運行環境是否為本地 file 協議
        const isLocalFile = window.location.protocol === 'file:';

        function switchTab(type) {
            document.getElementById('btn-bus').classList.remove('active');
            document.getElementById('btn-lrt').classList.remove('active');
            document.getElementById('panel-bus').classList.remove('active');
            document.getElementById('panel-lrt').classList.remove('active');

            if(type === 'lrt') {
                document.getElementById('btn-lrt').classList.add('active');
                document.getElementById('panel-lrt').classList.add('active');
            } else {
                document.getElementById('btn-bus').classList.add('active');
                document.getElementById('panel-bus').classList.add('active');
            }
        }

        // 1. 天氣數據處理
        async function fetchWeather() {
            const now = new Date();
            document.getElementById('wx-time').innerText = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
            
            if(isLocalFile) {
                return; // 本地環境直接跳過聯網，保留高擬真預設天氣
            }

            try {
                const res = await fetch(`https://weather.gov.hk{now.getTime()}`);
                const data = await res.json();
                if(data.temperature && data.temperature.data) {
                    const tsw = data.temperature.data.find(s => s.place === '天水圍') || data.temperature.data[0];
                    document.getElementById('wx-temp').innerText = `${tsw.value}°C`;
                    document.getElementById('wx-location').innerText = tsw.place;
                }
                if(data.weatherDescription) {
                    document.getElementById('wx-desc').innerText = data.weatherDescription.replace(/<\/?[^>]+(>|$)/g, "").substring(0, 10);
                }
            } catch (e) { console.error("天氣獲取失敗", e); }
        }

        // 2. 輕鐵數據處理
        async function fetchLrtData() {
            const container = document.getElementById('lrt-list');
            
            // 本地電腦直接點開的備用模擬數據，確保 100% 跑出排版
            if(isLocalFile) {
                document.getElementById('env-mode').innerText = "運行模式：本地安全模擬器";
                container.innerHTML = `
                    <div class="platform-header">5號月台</div>
                    <div class="list-item">
