<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交通資訊 - 實時動態</title>
    <style>
        :root {
            --mtr-orange: #ff9900;
            --lrt-bg: #e6f7f7;
            --lrt-text: #00a0a0;
            --text-dark: #333;
            --text-gray: #666;
            --banner-orange: #ffb74d;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .phone-container {
            width: 100%;
            max-width: 450px;
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            background: #fff;
            position: relative;
        }
        /* 頂部天氣列與即時時鐘 — 移除寫死height:20px避免文字截斷 */
        .weather-bar {
            background-color: #f1f3f5;
            padding: 10px 16px;
            font-size: 0.9rem;
            color: #495057;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e9ecef;
        }
        .weather-info span {
            margin-right: 8px;
            font-weight: bold;
        }
        
        /* 右上角手機動態時間 */
        #live-clock {
            font-size: 1rem;
            font-weight: bold;
            color: #222;
            letter-spacing: 0.5px;
        }
        /* 標題欄 */
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 50px;
            border-bottom: 1px solid #eee;
            position: relative;
        }
        .back-btn {
            position: absolute;
            left: 15px;
            font-size: 1.5rem;
            color: var(--text-gray);
            cursor: pointer;
        }
        .header-title {
            font-size: 1.1rem;
            font-weight: 500;
        }
        /* 頂部功能導航標籤 */
        .nav-tabs {
            display: flex;
            border-bottom: 1px solid #eee;
        }
        .tab-btn {
            flex: 1;
            text-align: center;
            padding: 14px 0;
            font-size: 1rem;
            color: var(--text-gray);
            cursor: pointer;
            border: none;
            background: none;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            outline: none;
        }
        .tab-btn.active {
            color: var(--text-dark);
            font-weight: bold;
            border-bottom: 3px solid var(--lrt-text);
        }
        /* 搜尋框樣式 */
        .search-container {
            padding: 12px 16px;
            background-color: #fff;
        }
        .search-box {
            display: flex;
            align-items: center;
            background-color: #f5f5f7;
            border: 1px solid #e0e0e0;
            border-radius: 25px;
            padding: 8px 16px;
        }
        .search-box input {
            border: none;
            background: none;
            outline: none;
            width: 100%;
            margin-left: 8px;
            font-size: 0.95rem;
            color: #333;
        }
        /* 橘黃色警告提示框 */
        .info-banner {
            background-color: #ffb74d;
            padding: 12px 16px;
            font-size: 0.85rem;
            color: #5d4037;
            line-height: 1.5;
            font-weight: bold;
        }
        /* 表頭 */
        .table-subheader {
            display: flex;
            justify-content: space-between;
            padding: 10px 16px;
            font-size: 0.9rem;
            color: var(--lrt-text);
            border-bottom: 1px solid #f0f0f0;
        }
        /* 列表容器 */
        .list-container {
            flex: 1;
            background-color: #f8f9fa;
        }
        /* 巴士列表項目 */
        .bus-item {
            background-color: #ffffff;
            padding: 16px;
            border-bottom: 1px solid #edf0f2;
            position: relative;
        }
        .bus-main-row {
            display: flex;
            align-items: flex-start;
        }
        .bus-route-no {
            font-size: 1.3rem;
            font-weight: bold;
            color: #222;
            width: 75px;
        }
        .bus-details {
            flex: 1;
        }
        .bus-dest {
            font-size: 1.05rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 2px;
        }
        .bus-stop-name {
            font-size: 0.85rem;
            color: #888;
        }
        .bus-arrow {
            color: #ccc;
            font-size: 1.1rem;
            padding-left: 10px;
        }
        .bus-status-row {
            display: flex;
            align-items: center;
            margin-top: 8px;
            font-size: 0.85rem;
            color: #ffa726;
        }
        .info-icon {
            display: inline-block;
            width: 14px;
            height: 14px;
            background-color: #ffa726;
            color: #fff;
            border-radius: 50%;
            text-align: center;
            line-height: 14px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-right: 6px;
        }
        /* 輕鐵列表項目 */
        .platform-header {
            background-color: var(--lrt-bg);
            color: var(--lrt-text);
            padding: 10px 16px;
            font-weight: bold;
            font-size: 1.05rem;
        }
        .lrt-item {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            background-color: #fff;
            border-bottom: 1px solid #f5f5f5;
        }
        .lrt-route-no {
            font-size: 1.2rem;
            font-weight: bold;
            width: 60px;
            color: var(--lrt-text);
        }
        .lrt-dest {
            font-size: 1.1rem;
            flex: 1;
            color: #222;
        }
        .train-visual {
            display: flex;
            align-items: center;
            margin-right: 15px;
        }
        .car { font-size: 1.3rem; line-height: 1; }
        .car.double { margin-left: -6px; }
        .eta-status {
            font-size: 1.05rem;
            font-weight: bold;
            text-align: right;
            width: 85px;
            color: #00bfa5;
        }
        .footer-note {
            padding: 20px 16px;
            font-size: 0.8rem;
            color: #999;
            line-height: 1.4;
            background-color: #fafafa;
            border-top: 1px solid #f0f0f0;
        }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }
        /* 時鐘日期 */
        .clock-box { text-align: right; }
        #live-date { font-size: 0.72rem; color: #888; margin-top: 2px; }
        #clock-sync { font-size: 0.65rem; color: #00a0a0; margin-top: 1px; }
        #clock-sync.unsynced { color: #bbb; }
        /* 巴士第二班次 / 更新時間 */
        .bus-eta-next { color: #bbb; font-size: 0.78rem; margin-left: 10px; }
        .loading-note { padding: 24px 16px; color: #999; font-size: 0.9rem; text-align: center; }
        /* 巴士月台分組標題（重用輕鐵樣式，改橙色系） */
        .bus-platform { background-color: #fff4e5; color: #e65100; }
        /* 巴士資料更新時間 */
        .bus-updated-time { font-size: 0.72rem; font-weight: normal; color: #795548; margin-top: 4px; }
        /* 箭頭旁的下一班分鐘數 */
        .bus-eta-badge {
            font-size: 1.05rem;
            font-weight: bold;
            color: #ffa726;
            white-space: nowrap;
            padding-left: 8px;
        }
        /* 展開的班次列表 */
        .bus-expand { display: none; margin-top: 8px; }
        .bus-item.expanded .bus-expand { display: block; }
        .bus-expand-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            background: #fffaf2;
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }
        .bus-expand-row .seq { color: #bbb; width: 28px; }
        .bus-expand-row .time { flex: 1; color: #555; }
        .bus-expand-row .mins { font-weight: bold; color: #ffa726; }
        /* 展開箭頭圖標（SVG chevron + 圓形底） */
        .bus-arrow {
            cursor: pointer;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #fff4e5;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 6px;
            flex-shrink: 0;
            transition: transform 0.25s ease, background 0.2s;
            user-select: none;
        }
        .bus-arrow svg {
            width: 14px;
            height: 14px;
            stroke: #e65100;
            stroke-width: 2.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .bus-item.expanded .bus-arrow { transform: rotate(180deg); background: #ffe0b2; }
    </style>
</head>
<body>
    <div class="phone-container">
        
        <!-- 🌦️ 左上角天文台實時天氣報告 ＋ 右上角精準手機動態時鐘 -->
        <div class="weather-bar">
            <div class="weather-info">
                <span id="wx-location">天水圍</span>
                <span id="wx-temp">--°C</span>
                <span id="wx-desc">獲取天氣中...</span>
            </div>
            <!-- 🕒 與港鐵伺服器時間同步的實時時鐘 -->
            <div class="clock-box">
                <div id="live-clock">--:--:--</div>
                <div id="live-date">----年--月--日</div>
                <div id="clock-sync">同步中...</div>
            </div>
        </div>
        <div class="header">
            <div class="back-btn">←</div>
            <div class="header-title">交通資訊</div>
        </div>
        <!-- 🚌 / 🚇 分頁切換鈕 -->
        <div class="nav-tabs">
            <button id="btn-bus" class="tab-btn active" onclick="switchTab('bus')">🚌 公共巴士</button>
            <button id="btn-lrt" class="tab-btn" onclick="switchTab('lrt')">🚇 輕鐵</button>
        </div>

        <!-- ================= 🚌 公共巴士分頁面板 ================= -->
        <div id="panel-bus" class="tab-panel active">
            <!-- 搜尋輸入框 -->
            <div class="search-container">
                <div class="search-box">
                    <span>🔍</span>
                    <input type="text" id="bus-search" placeholder="搜尋路線">
                </div>
            </div>
            <!-- 橘黃色備註提示條 + 資料更新時間 -->
            <div class="info-banner">
                *備註：以下資料僅供參考，一切以交通營辦商提供之資訊為準。
                <div id="bus-updated" class="bus-updated-time">資料更新中...</div>
            </div>
            <div class="table-subheader">
                <div>路線 &nbsp;&nbsp;&nbsp;&nbsp; 目的地</div>
                <div class="right-sort">等候時間</div>
            </div>
            <!-- 🚌 真實九巴 ETA 動態渲染 -->
            <div class="list-container" id="bus-list">
                <div class="loading-note">🚌 班次資料載入中...</div>
            </div>
        </div>

        <!-- ================= 🚇 輕鐵分頁面板 ================= -->
        <div id="panel-lrt" class="tab-panel">
            <div class="info-banner" id="lrt-banner">🚇 輕鐵天水圍站 · 班次載入中...</div>
            <div class="table-subheader">
                <div>路線 &nbsp;&nbsp;&nbsp;&nbsp; 目的地</div>
                <div class="right-sort">等候時間</div>
            </div>
            <!-- 🚇 真實港鐵輕鐵班次動態渲染 -->
            <div class="list-container" id="lrt-list">
                <div class="loading-note">🚇 班次資料載入中...</div>
            </div>
        </div>

        <div class="footer-note">
            *備註：以上資料僅供參考，一切以交通營辦商提供之資訊為準。
        </div>
    </div>

    <script>
        // ============================================================
        // 🕒 API 同步時鐘：以港鐵伺服器時間為準
        // 原理：每次取得輕鐵班次時，用回應的 Date 標頭（HTTP 標準伺服器
        // 時間，CORS 已放行可讀）計算與本機時鐘的偏差 offset；之後每秒
        // 用「本機時間 + offset」顯示，即為真實香港伺服器時間。
        // 外部時間 API（worldtimeapi 等）已被實測證實遭本網絡封鎖，
        // 故直接利用每 30 秒必然更新的輕鐵 API 作時間來源，穩定可靠。
        // ============================================================
        let serverTimeOffset = 0;   // 伺服器時間 - 本機時間（毫秒）
        let clockSynced = false;

        // 從輕鐵 API 回應同步時間（Date 標頭優先，system_time 欄位後備）
        function syncServerTime(dateHeader, systemTime) {
            let serverMs = null;
            if (dateHeader) serverMs = new Date(dateHeader).getTime();
            if ((!serverMs || isNaN(serverMs)) && systemTime) {
                // system_time 格式 "2026-10-31 13:56:55"（香港時間 UTC+8）
                serverMs = new Date(systemTime.replace(' ', 'T') + '+08:00').getTime();
            }
            if (serverMs && !isNaN(serverMs)) {
                serverTimeOffset = serverMs - Date.now();
                clockSynced = true;
                const el = document.getElementById('clock-sync');
                if (el) { el.innerText = '● 已同步伺服器時間'; el.classList.remove('unsynced'); }
            }
        }

        function startIndependentClock() {
            const weekDays = ['日','一','二','三','四','五','六'];
            function updateClock() {
                // 本機時間 + 伺服器偏差 = 真實香港時間
                const now = new Date(Date.now() + serverTimeOffset);
                const hh = String(now.getHours()).padStart(2, '0');
                const mm = String(now.getMinutes()).padStart(2, '0');
                const clockEl = document.getElementById('live-clock');
                const dateEl = document.getElementById('live-date');
                if (clockEl) clockEl.innerText = `${hh}:${mm}`;
                if (dateEl) dateEl.innerText = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 星期${weekDays[now.getDay()]}`;
            }
            updateClock();
            setInterval(updateClock, 1000);
        }

        // 標籤切換邏輯
        function switchTab(type) {
            document.getElementById('btn-bus').classList.remove('active');
            document.getElementById('btn-lrt').classList.remove('active');
            document.getElementById('panel-bus').classList.remove('active');
            document.getElementById('panel-lrt').classList.remove('active');
            if(type === 'lrt') {
                document.getElementById('btn-lrt').classList.add('active');
                document.getElementById('panel-lrt').classList.add('active');
            } else {
                document.getElementById('btn-bus').classList.add('active');
                document.getElementById('panel-bus').classList.add('active');
            }
        }

        // ============================================================
        // 🌦️ 香港天文台 rhrread 實時天氣（已實測可用）
        // ⚠️ 修正點1：rhrread 沒有 weatherDesc 欄位 → 改用 icon 代碼對照
        // ⚠️ 修正點2：接口內無「天水圍」測站 → 用最接近的「流浮山」
        // ============================================================
        const HKO_ICON_DESC = {
            50:'天晴', 51:'時間多雲', 52:'短暫時間有陽光', 53:'多雲有幾陣驟雨',
            54:'有陽光有驟雨', 60:'多雲', 61:'天陰', 62:'微雨', 63:'雨',
            64:'大雨', 65:'雷暴', 70:'天色良好', 71:'天色大致良好', 72:'大致良好',
            73:'天色大致多雲', 74:'大致多雲有一兩陣驟雨', 75:'多雲有驟雨',
            76:'大致多雲', 77:'大致多雲有驟雨', 80:'大風', 81:'乾燥', 82:'潮濕',
            83:'霧', 84:'薄霧', 85:'煙霞', 90:'熱', 91:'暖', 92:'涼', 93:'冷'
        };
        async function fetchHKWeather() {
            try {
                const targetUrl = 'https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc';
                const res = await fetch(targetUrl);
                const data = await res.json();

                // 天水圍無測站，用最接近的流浮山，次選元朗公園
                const tempObj = data.temperature.data.find(item => item.place === '流浮山')
                             || data.temperature.data.find(item => item.place === '元朗公園')
                             || data.temperature.data.find(item => item.place === '香港天文台');
                if (tempObj) {
                    document.getElementById('wx-temp').innerText = tempObj.value + '°C';
                }
                const iconCode = (data.icon && data.icon.length) ? data.icon[0] : null;
                const humidity = (data.humidity && data.humidity.data && data.humidity.data[0]) ? data.humidity.data[0].value : null;
                const descText = HKO_ICON_DESC[iconCode] || '';
                document.getElementById('wx-desc').innerText =
                    descText + (humidity !== null ? ` · 濕度${humidity}%` : '');
            } catch (err) {
                console.error('天氣獲取失敗', err);
                document.getElementById('wx-desc').innerText = '天氣讀取失敗';
            }
        }

        // ============================================================
        // 🚌 九巴真實 ETA（data.etabus.gov.hk，已實測可用，免 key）
        // 天水圍市中心全部 6 個候車月台（TN940–TN945），ID 已實測確認
        // ============================================================
        const BUS_STOPS = [
            { id: '0AE307AC4840B867', name: 'TN940' },
            { id: 'DFC270E9F05B557E', name: 'TN941' },
            { id: '7A37046C302EFBEE', name: 'TN942' },
            { id: '1A52AD7D8F64311F', name: 'TN943' },
            { id: '8370DDFF896AC3E0', name: 'TN944' },
            { id: 'AA92A3F2775F4F69', name: 'TN945' }
        ];

        function formatEta(isoString) {
            const mins = Math.round((new Date(isoString) - Date.now()) / 60000);
            return mins <= 0 ? '即將抵達' : `${mins} 分鐘`;
        }

        async function fetchBusEtas() {
            const list = document.getElementById('bus-list');
            // 同時取全部 6 個月台的班次，各站獨立錯誤處理
            const results = await Promise.all(BUS_STOPS.map(async (s) => {
                try {
                    const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${s.id}`);
                    const json = await res.json();
                    // 按路線分組（包括沒有班次的記錄，如 265S），每線取頭兩班
                    const byRoute = {};
                    (json.data || []).forEach(d => {
                        if (!byRoute[d.route]) byRoute[d.route] = { route: d.route, dest: d.dest_tc || '', etas: [] };
                        if (d.eta) byRoute[d.route].etas.push(d.eta);
                    });
                    Object.values(byRoute).forEach(r => {
                        // 排序後按「分鐘」去重（同一班次可能有多筆差幾秒的記錄）
                        const seenMins = new Set();
                        r.etas = r.etas
                            .sort((a, b) => new Date(a) - new Date(b))
                            .filter(t => {
                                const m = Math.round((new Date(t) - Date.now()) / 60000);
                                if (seenMins.has(m)) return false;
                                seenMins.add(m);
                                return true;
                            })
                            .slice(0, 3); // 保留頭三班，供展開列表顯示
                    });
                    const routes = Object.values(byRoute).sort((a, b) => a.route.localeCompare(b.route, 'en', { numeric: true }));
                    return { ...s, routes, error: false };
                } catch (err) {
                    console.error(`月台 ${s.name} ETA 獲取失敗`, err);
                    return { ...s, routes: [], error: true };
                }
            }));

            list.innerHTML = results.map(s => {
                let body;
                if (s.error) {
                    body = '<div class="bus-item"><div class="bus-status-row"><span class="info-icon">i</span> 班次讀取失敗，稍後重試</div></div>';
                } else if (s.routes.length === 0) {
                    body = '<div class="bus-item"><div class="bus-status-row"><span class="info-icon">i</span> 暫時沒有預定班次</div></div>';
                } else {
                    body = s.routes.map(r => {
                        const hasEta = r.etas.length > 0;
                        // 箭頭旁顯示下一班分鐘數
                        const badge = hasEta ? formatEta(r.etas[0]) : '--';
                        // 展開區：列出未來班次（實際時刻 + 分鐘倒數）
                        const expandHtml = hasEta
                            ? r.etas.map((t, i) => {
                                const d = new Date(t);
                                const clock = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
                                return `
                                <div class="bus-expand-row">
                                    <span class="seq">${i + 1}.</span>
                                    <span class="time">${clock}</span>
                                    <span class="mins">${formatEta(t)}</span>
                                </div>`;
                            }).join('')
                            : '<div class="bus-expand-row"><span class="time">暫時沒有預定班次</span></div>';
                        // 無班次路線（如 265S 非服務日）仍顯示提示行
                        const statusHtml = hasEta ? '' :
                            '<div class="bus-status-row"><span class="info-icon">i</span> 暫時沒有預定班次</div>';
                        return `
                        <div class="bus-item" data-route="${r.route}" onclick="this.classList.toggle('expanded')">
                            <div class="bus-main-row">
                                <div class="bus-route-no">${r.route}</div>
                                <div class="bus-details">
                                    <div class="bus-dest">往 ${r.dest}</div>
                                    <div class="bus-stop-name">天水圍市中心 (${s.name})</div>
                                </div>
                                <div class="bus-eta-badge">${badge}</div>
                                <div class="bus-arrow"><svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg></div>
                            </div>
                            ${statusHtml}
                            <div class="bus-expand">${expandHtml}</div>
                        </div>`;
                    }).join('');
                }
                return `<div class="platform-header bus-platform">月台 ${s.name}</div>` + body;
            }).join('');

            // 🕒 顯示資料更新時間（用伺服器同步時間）
            const updEl = document.getElementById('bus-updated');
            if (updEl) {
                const t = new Date(Date.now() + serverTimeOffset);
                updEl.innerText = `資料更新時間 ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}:${String(t.getSeconds()).padStart(2,'0')}`;
            }

            // 渲染後重新套用搜尋過濾
            filterBusList();
        }

        // 🔍 搜尋過濾巴士路線（隱藏無符合項目的月台標題）
        function filterBusList() {
            const keyword = (document.getElementById('bus-search').value || '').trim().toUpperCase();
            document.querySelectorAll('#bus-list .bus-item').forEach(item => {
                const route = item.dataset.route || '';
                item.style.display = route.toUpperCase().includes(keyword) ? '' : 'none';
            });
            document.querySelectorAll('#bus-list .platform-header').forEach(header => {
                let el = header.nextElementSibling;
                let anyVisible = false;
                while (el && !el.classList.contains('platform-header')) {
                    if (el.style.display !== 'none') anyVisible = true;
                    el = el.nextElementSibling;
                }
                header.style.display = anyVisible ? '' : 'none';
            });
        }

        // ============================================================
        // 🚇 港鐵輕鐵真實班次（rt.data.gov.hk，已實測可用，免 key）
        // 天水圍站 station_id = 480
        // ============================================================
        const LRT_ROUTE_COLORS = {
            '505':'#e4002b','507':'#00a650','610':'#8b4513','614':'#009bdf',
            '614P':'#f2a900','615':'#8b4513','615P':'#0057b8','705':'#d32f2f',
            '706':'#388e3c','751':'#7b1fa2','751P':'#00838f','761P':'#f57c00'
        };

        async function fetchLrtSchedule() {
            try {
                const res = await fetch('https://rt.data.gov.hk/v1/transport/mtr/lrt/getSchedule?station_id=480&language=TC');
                const data = await res.json();
                if (data.status !== 1 || !data.platform_list) throw new Error('API 回傳異常');

                // 🕒 順帶用今次回應同步時鐘（每 30 秒自動校正一次）
                syncServerTime(res.headers.get('Date'), data.system_time);

                document.getElementById('lrt-banner').innerHTML =
                    `🚇 輕鐵天水圍站 · 資料更新時間 ${data.system_time || ''}`;

                const list = document.getElementById('lrt-list');
                list.innerHTML = data.platform_list.map(pf => {
                    const items = pf.route_list.map(t => {
                        const color = LRT_ROUTE_COLORS[t.route_no] || '#555';
                        const cars = t.train_length >= 2
                            ? '<span class="car">🚃</span><span class="car double">🚃</span>'
                            : '<span class="car">🚃</span>';
                        return `
                        <div class="lrt-item">
                            <div class="lrt-route-no" style="color: ${color};">${t.route_no}</div>
                            <div class="lrt-dest">${t.dest_ch}</div>
                            <div class="train-visual">${cars}</div>
                            <div class="eta-status">${t.time_ch}</div>
                        </div>`;
                    }).join('');
                    return `<div class="platform-header">${pf.platform_id}號月台</div>` + items;
                }).join('');
            } catch (err) {
                console.error('輕鐵班次獲取失敗', err);
                document.getElementById('lrt-banner').innerHTML = '🚇 輕鐵班次讀取失敗，稍後自動重試';
            }
        }

        // ============================================================
        // 頁面載入初始化 + 定時自動刷新
        // ============================================================
        window.addEventListener('DOMContentLoaded', () => {
            startIndependentClock();
            fetchHKWeather();
            fetchBusEtas();
            fetchLrtSchedule(); // 首次呼叫即完成時鐘同步

            document.getElementById('bus-search').addEventListener('input', filterBusList);

            // 若輕鐵 API 長時間失敗，標示時鐘為未同步狀態
            setInterval(() => {
                if (!clockSynced) {
                    const el = document.getElementById('clock-sync');
                    if (el) { el.innerText = '○ 使用本機時間'; el.classList.add('unsynced'); }
                }
            }, 5000);

            setInterval(fetchHKWeather, 10 * 60 * 1000); // 天氣每10分鐘
            setInterval(fetchBusEtas, 30 * 1000);        // 巴士每30秒
            setInterval(fetchLrtSchedule, 30 * 1000);    // 輕鐵每30秒
        });
    </script>
</body>
</html>
